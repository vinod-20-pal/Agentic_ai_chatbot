<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal AI Chatbot Agent</title>
    <style>
      :root {
        --bg: #0f1116;
        --panel: #1a1d27;
        --border: #2a2f3d;
        --accent: #6c5ce7;
        --text: #e6e6e6;
        --muted: #9aa0ab;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }
      .container { width: 100%; max-width: 720px; }
      h1 { margin: 0 0 4px; font-size: 1.6rem; }
      p.sub { margin: 0 0 24px; color: var(--muted); }
      label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 0.9rem; }
      textarea, select, input[type="text"] {
        width: 100%;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.95rem;
        font-family: inherit;
      }
      textarea { resize: vertical; }
      .row { display: flex; gap: 16px; }
      .row > div { flex: 1; }
      .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
      .checkbox input { width: auto; }
      button {
        margin-top: 20px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .response {
        margin-top: 24px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        white-space: pre-wrap;
        line-height: 1.5;
        min-height: 40px;
      }
      .response.error { border-color: #e74c3c; color: #ff9c8f; }
      .response h3 { margin-top: 0; }
      .radio-group { display: flex; gap: 16px; margin-top: 6px; }
      .radio-group label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
      .radio-group input { width: auto; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Personal AI Chatbot Agent</h1>
      <p class="sub">Create and interact with the AI agents!</p>

      <label for="systemPrompt">Define your AI Agent</label>
      <textarea id="systemPrompt" rows="2" placeholder="Type your system prompt here..."></textarea>

      <div class="row">
        <div>
          <label>Select Provider</label>
          <div class="radio-group">
            <label><input type="radio" name="provider" value="Groq" checked /> Groq</label>
            <label><input type="radio" name="provider" value="OpenAI" /> OpenAI</label>
          </div>
        </div>
        <div>
          <label for="model">Select Model</label>
          <select id="model"></select>
        </div>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="allowSearch" />
        <label for="allowSearch" style="margin: 0; font-weight: 400;">Allow to search the web</label>
      </div>

      <label for="query">Enter your Query</label>
      <textarea id="query" rows="5" placeholder="Ask Anything!!!"></textarea>

      <button id="askBtn">Ask Agent!</button>

      <div id="response" class="response" style="display: none;"></div>
    </div>

    <script>
      // Model options per provider (mirrors MODEL_NAMES_GROQ / MODEL_NAMES_OPENAI).
      const MODELS = {
        Groq: ["llama-3.3-70b-versatile", "mixtral-8x7b-32768"],
        OpenAI: ["gpt-4o-mini"],
      };

      const modelSelect = document.getElementById("model");
      const responseEl = document.getElementById("response");
      const askBtn = document.getElementById("askBtn");

      function currentProvider() {
        return document.querySelector('input[name="provider"]:checked').value;
      }

      // Populate the model dropdown based on the selected provider.
      function populateModels() {
        const provider = currentProvider();
        modelSelect.innerHTML = "";
        for (const m of MODELS[provider]) {
          const opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m;
          modelSelect.appendChild(opt);
        }
      }

      document
        .querySelectorAll('input[name="provider"]')
        .forEach((r) => r.addEventListener("change", populateModels));
      populateModels();

      function showResponse(text, isError) {
        responseEl.style.display = "block";
        responseEl.className = "response" + (isError ? " error" : "");
        responseEl.innerHTML = isError
          ? "<h3>Error</h3>" + text
          : "<h3>Agent Response</h3>" + text;
      }

      askBtn.addEventListener("click", async () => {
        const query = document.getElementById("query").value.trim();
        if (!query) {
          showResponse("Please enter a query.", true);
          return;
        }

        // Build the payload matching the backend schema (RequestState).
        const payload = {
          model_name: modelSelect.value,
          model_provider: currentProvider(),
          system_prompt: document.getElementById("systemPrompt").value,
          messages: [query],
          allow_search: document.getElementById("allowSearch").checked,
        };

        askBtn.disabled = true;
        askBtn.textContent = "Thinking...";
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) {
            showResponse(data.error || "Request failed.", true);
          } else {
            // Backend returns the answer as a plain JSON string.
            showResponse(typeof data === "string" ? data : JSON.stringify(data), false);
          }
        } catch (err) {
          showResponse(String(err), true);
        } finally {
          askBtn.disabled = false;
          askBtn.textContent = "Ask Agent!";
        }
      });
    </script>
  </body>
</html>
